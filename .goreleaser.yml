version: 2

project_name: beszel

before:
  hooks:
    - go mod tidy
    - go generate -run fetchsmartctl ./agent

builds:
  - id: beszel
    binary: beszel
    main: internal/cmd/hub/hub.go
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
      - freebsd
    goarch:
      - amd64
      - arm64
      - arm
    ignore:
      - goos: windows
        goarch: arm64
      - goos: windows
        goarch: arm
      - goos: freebsd
        goarch: arm64
      - goos: freebsd
        goarch: arm
      - goos: darwin
        goarch: arm

  - id: beszel-agent
    binary: beszel-agent
    main: internal/cmd/agent/agent.go
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/henrygd/beszel/internal/ghupdate.buildGOARM={{ .Arm }}
    goos:
      - linux
      - darwin
      - freebsd
      - openbsd
      - windows
    goarch:
      - amd64
      - arm64
      - arm
      - mips64
      - riscv64
      - mipsle
      - mips
      - ppc64le
    goarm:
      - "5"
      - "6"
      - "7"
    gomips:
      - hardfloat
      - softfloat
    ignore:
      - goos: freebsd
        goarch: arm
      - goos: openbsd
        goarch: arm
      - goos: linux
        goarch: mips64
        gomips: softfloat
      - goos: linux
        goarch: mipsle
        gomips: hardfloat
      - goos: linux
        goarch: mips
        gomips: hardfloat
      - goos: windows
        goarch: arm
      - goos: darwin
        goarch: arm
      - goos: darwin
        goarch: riscv64
      - goos: windows
        goarch: riscv64
      # Go 1.24 dropped the mips* and ppc64le ports on darwin, freebsd, openbsd
      # and windows. goreleaser builds the whole goos x goarch product minus this
      # list, so every pair the toolchain rejects must be named here or the
      # release dies with "unsupported GOOS/GOARCH pair".
      - {goos: darwin, goarch: mips64}
      - {goos: darwin, goarch: mipsle}
      - {goos: darwin, goarch: mips}
      - {goos: darwin, goarch: ppc64le}
      - {goos: freebsd, goarch: mips64}
      - {goos: freebsd, goarch: mipsle}
      - {goos: freebsd, goarch: mips}
      - {goos: freebsd, goarch: ppc64le}
      - {goos: freebsd, goarch: riscv64}
      - {goos: openbsd, goarch: mips64}
      - {goos: openbsd, goarch: mipsle}
      - {goos: openbsd, goarch: mips}
      - {goos: openbsd, goarch: ppc64le}
      - {goos: windows, goarch: mips64}
      - {goos: windows, goarch: mipsle}
      - {goos: windows, goarch: mips}
      - {goos: windows, goarch: ppc64le}

  - id: beszel-agent-linux-amd64-glibc
    binary: beszel-agent
    main: internal/cmd/agent/agent.go
    env:
      - CGO_ENABLED=0
    flags:
      - -tags=glibc
    goos:
      - linux
    goarch:
      - amd64

archives:
  - id: beszel-agent
    formats: [tar.gz]
    ids:
      - beszel-agent
    name_template: >-
      {{ .Binary }}_
      {{- .Os }}_
      {{- .Arch }}
      {{- if ne .Arm "6" }}{{ with .Arm }}v{{ . }}{{ end }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]

  - id: beszel-agent-linux-amd64-glibc
    formats: [tar.gz]
    ids:
      - beszel-agent-linux-amd64-glibc
    name_template: >-
      {{ .Binary }}_
      {{- .Os }}_
      {{- .Arch }}_glibc

  - id: beszel
    formats: [tar.gz]
    ids:
      - beszel
    name_template: >-
      {{ .Binary }}_
      {{- .Os }}_
      {{- .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]

nfpms:
  - id: beszel-agent
    package_name: beszel-agent
    description: |-
      Agent for Beszel
      Beszel is a lightweight server monitoring platform that includes Docker
      statistics, historical data, and alert functions. It has a friendly web
      interface, simple configuration, and is ready to use out of the box.
      It supports automatic backup, multi-user, OAuth authentication, and
      API access.
    maintainer: imlilian <imlilian@users.noreply.github.com>
    section: net
    ids:
      - beszel-agent
    formats:
      - deb
    contents:
      - src: ./supplemental/debian/beszel-agent.service
        dst: lib/systemd/system/beszel-agent.service
        packager: deb
      - src: ./supplemental/debian/copyright
        dst: usr/share/doc/beszel-agent/copyright
        packager: deb
      - src: ./supplemental/debian/lintian-overrides
        dst: usr/share/lintian/overrides/beszel-agent
        packager: deb
    scripts:
      postinstall: ./supplemental/debian/postinstall.sh
      preremove: ./supplemental/debian/prerm.sh
      postremove: ./supplemental/debian/postrm.sh
    deb:
      predepends:
        - adduser
        - debconf
      scripts:
        templates: ./supplemental/debian/templates
        config: ./supplemental/debian/config.sh

# scoops / brews / winget are intentionally removed: this fork publishes
# neither a scoop bucket, a homebrew tap nor a winget package, and the UI
# hides those install commands. Keeping them would only template around
# missing tokens and add a publish-time failure mode.

release:
  # Published immediately (upstream keeps it as a draft to write notes first).
  # A draft's assets are not publicly downloadable, which would break the
  # install scripts, which resolve `releases/latest`.
  draft: false
  # Forced to false for the same reason: the fork's version is a semver
  # pre-release (`0.21.1-beszelx.1`), and the default `auto` mirrors that into
  # GitHub's pre-release flag. GitHub then leaves the release out of
  # `releases/latest`, which is exactly the endpoint the install scripts and
  # the self-updater resolve.
  prerelease: false

changelog:
  disable: true
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
